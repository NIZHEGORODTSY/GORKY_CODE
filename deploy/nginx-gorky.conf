# Сайт бота для уже установленного на сервере nginx (если порты 80/443 заняты другим проектом).
# Обслуживает ТОЛЬКО наш домен — остальные сайты nginx не затрагиваются.
# Установка — docs/DEPLOY.md, раздел «HTTPS через существующий nginx».
server {
    listen 80;
    listen [::]:80;
    server_name 89-111-136-194.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
