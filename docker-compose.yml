services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только localhost VPS (порт 5433, чтобы не конфликтовать с Postgres, установленным на сервере);
    # с компьютера — через SSH-туннель, см. README.md
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # Mini App и календарь — только на localhost сервера; наружу их отдаёт Caddy или уже стоящий nginx
    ports:
      - "127.0.0.1:${WEBAPP_HOST_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Прокси для Telegram, если хостинг его блокирует (VLESS из VPN-подписки).
  # Конфиг: python3 scripts/vless_to_xray.py '<ссылка>' -> xray/config.json; в .env TELEGRAM_PROXY=socks5://xray:1080
  xray:
    image: teddysun/xray:latest
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro

  # HTTPS для Mini App. Запуск: docker compose --profile https up -d (нужен WEBAPP_DOMAIN в .env)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bot

volumes:
  pgdata:
  caddy_data:
