<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь · Горький</title>
<style>
  :root { --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --hint: #8e8e93; --accent: #5b5bd6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --hint: #8e8e93; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 420px; margin: 0 auto; background: var(--card); border-radius: 20px; padding: 24px; text-align: center; }
  .icon { font-size: 48px; }
  h1 { font-size: 21px; margin: 8px 0 6px; }
  p { color: var(--hint); margin: 0 0 20px; }
  a.btn, button { display: block; width: 100%; padding: 14px; margin: 10px 0 0; border: 0; border-radius: 14px;
                  font: 600 16px/1.2 inherit; text-decoration: none; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .secondary { background: var(--bg); color: var(--text); }
  .note { font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📆</div>
  <h1>Планы в календаре телефона</h1>
  <p id="lead">Подключи один раз — задачи, напоминания и встречи из бота будут появляться в календаре сами.</p>
  <a class="btn primary" id="apple" href="__WEBCAL__">Добавить в Календарь iPhone / Mac</a>
  <a class="btn primary" id="google" href="__GOOGLE__">Добавить в Google Календарь</a>
  <button class="secondary" id="copy">Скопировать ссылку</button>
  <p class="note">Яндекс Календарь, Outlook и другие: «Подписаться на календарь» → вставь ссылку.</p>
</div>
<script>
  const ua = navigator.userAgent;
  const isApple = /iPhone|iPad|iPod|Macintosh/.test(ua);
  const isAndroid = /Android/.test(ua);
  const apple = document.getElementById("apple"), google = document.getElementById("google");
  // Нужная кнопка — первой; на iPhone сразу открываем системное окно подписки
  if (isAndroid) { apple.className = "btn secondary"; google.parentNode.insertBefore(google, apple); }
  if (isApple) { google.className = "btn secondary"; setTimeout(() => { location.href = apple.href; }, 300); }
  document.getElementById("copy").onclick = async (e) => {
    try { await navigator.clipboard.writeText("__HTTPS__"); e.target.textContent = "Ссылка скопирована ✓"; }
    catch { prompt("Скопируй ссылку:", "__HTTPS__"); }
  };
</script>
</body>
</html>
